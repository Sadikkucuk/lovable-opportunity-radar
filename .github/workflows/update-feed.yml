name: Update combined RSS

on:
  workflow_dispatch:
  schedule:
    # 23:37 Istanbul / 20:37 UTC: freeze nightly news before worker startup.
    - cron: "37 20 * * *"
  push:
    branches: [main]
    paths:
      - "aggregate.py"
      - "sources.opml"
      - ".github/workflows/update-feed.yml"

permissions:
  contents: write

concurrency:
  group: update-combined-rss
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether production feed collection is enabled
        id: mode
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          with open("state/v2/config.json", encoding="utf-8") as f:
              enabled = json.load(f).get("mode") == "active"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("enabled=" + str(enabled).lower() + "\n")
          print("Feed collection enabled:", enabled)
          PY

      - name: Set up Python
        if: steps.mode.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.mode.outputs.enabled == 'true'
        run: pip install -r requirements.txt

      - name: Merge feeds
        if: steps.mode.outputs.enabled == 'true'
        env:
          RETENTION_HOURS: "72"
          MAX_ITEMS: "0"
          MAX_PER_SOURCE: "0"
          BATCH_SIZE: "40"
          FETCH_WORKERS: "20"
          FETCH_TIMEOUT: "20"
        run: python aggregate.py

      - name: Commit updated feed
        if: steps.mode.outputs.enabled == 'true'
        run: |
          if git diff --quiet -- docs/feed.xml docs/latest.json docs/status.json docs/batches; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/latest.json docs/status.json docs/batches
          git commit -m "Update combined RSS"
          # The repository can receive prompt/code commits while this job is running.
          # Rebase before push so an unrelated newer commit does not reject the feed update.
          git pull --rebase origin main
          git push
