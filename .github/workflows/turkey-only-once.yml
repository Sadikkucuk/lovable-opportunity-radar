name: One-time Türkiye-only radar snapshot

on:
  push:
    paths:
      - ".github/workflows/turkey-only-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turkey-only-once
  cancel-in-progress: true

jobs:
  build-turkey-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Türkiye-only snapshot
        env:
          SOURCE_FOLDER_PREFIX: "Türkiye"
          OUTPUT_DIR: "docs/turkey-only"
          LOAD_EXISTING: "0"
          RETENTION_HOURS: "72"
          MAX_ITEMS: "1000"
          MAX_PER_SOURCE: "40"
          BATCH_SIZE: "40"
          FETCH_WORKERS: "20"
          FETCH_TIMEOUT: "20"
        run: python aggregate.py

      - name: Commit Türkiye-only snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/turkey-only
          if git diff --cached --quiet; then
            echo "No Türkiye-only snapshot changes."
            exit 0
          fi
          git commit -m "Add one-time Türkiye-only radar snapshot"
          git pull --rebase origin main
          git push
