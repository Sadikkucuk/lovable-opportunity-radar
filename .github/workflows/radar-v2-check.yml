name: Radar v2 integrity
on:
  pull_request:
  push:
    branches: [main, feat/radar-v2-safe]
    paths:
      - 'radar/**'
      - 'tests/**'
      - 'state/idea_catalog.json'
      - 'state/idea_history.json'
      - 'state/v2/protection/**'
      - 'prompts/**'
      - 'CHATGPT_RADAR_PROMPT.txt'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m radar.engine check
