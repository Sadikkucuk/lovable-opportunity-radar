name: Radar morning report
on:
  workflow_dispatch:
  schedule:
    # 07:05 Istanbul / 04:05 UTC: persisted report before 07:15 ChatGPT digest.
    - cron: '5 4 * * *'
permissions:
  contents: write
concurrency:
  group: radar-morning-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate factual report from verified records
        run: python -m radar.morning_report
      - name: Save report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/radar/reports
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Radar: nightly operational report"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main || exit 1
          done
          exit 1
